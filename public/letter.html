<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Letter, Just for You 🎁</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<meta property="og:title" content="🎁 A letter, just for you">
<meta property="og:description" content="Someone sent you a magical personalised letter — tap to open it, with music!">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/cinematic.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:#0a1130;color:#fff;font-family:"Nunito",system-ui,sans-serif;line-height:1.6;overflow-x:hidden;}
  .page{max-width:640px;margin:0 auto;padding:clamp(16px,4vw,32px) max(16px,env(safe-area-inset-left,0px)) 64px;padding-right:max(16px,env(safe-area-inset-right,0px));}

  .overlay{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 0%,#1b2a52,#070b1c 72%);transition:opacity .5s ease;}
  .overlay.hide{opacity:0;pointer-events:none;}
  .gift{font-size:clamp(4rem,18vw,7rem);filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}}
  .overlay h1{font-family:"Fraunces",serif;font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);margin:16px 0 6px;color:#fff;text-wrap:balance;}
  .overlay p{color:#d8def0;max-width:34ch;margin:0 0 24px;}
  .open-btn{font-family:"Nunito",sans-serif;font-weight:800;font-size:1.15rem;border:0;cursor:pointer;color:#3a1200;background:linear-gradient(180deg,#ffe08a,#f0b43a);padding:16px 34px;border-radius:999px;box-shadow:0 12px 30px rgba(240,180,58,.45);text-decoration:none;display:inline-block;animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

  .actions{margin-top:28px;text-align:center;}
  .actions h3{font-family:"Fraunces",serif;color:#fff;font-size:1.3rem;margin:0 0 4px;}
  .actions p{color:#cfd6ea;font-size:.92rem;margin:0 0 16px;}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .b{font-family:"Nunito",sans-serif;font-weight:800;font-size:.98rem;border:0;cursor:pointer;text-decoration:none;padding:13px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease;color:#fff;}
  .b:hover{transform:translateY(-2px);}
  .b-wa{background:#25d366;color:#05331a;}
  .b-fb{background:#1877f2;}
  .b-copy{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);}
  .b-make{margin-top:22px;background:linear-gradient(180deg,#ffe08a,#f0b43a);color:#3a1200;font-size:1.05rem;padding:15px 30px;}

  .music{position:fixed;z-index:20;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;background:#ffd98a;color:#2a1a00;font-size:1.5rem;box-shadow:0 10px 26px rgba(0,0,0,.4);display:grid;place-items:center;}
  @media (prefers-reduced-motion:reduce){.gift,.open-btn{animation:none;}}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="gift" id="ov-emoji">🎁</div>
  <h1 id="ov-title">A letter, just for you</h1>
  <p id="ov-sub">Someone special sent this to you. Tap to open it — with music! 🎶</p>
  <button class="open-btn" id="ov-open">Open my letter 🎄</button>
</div>

<div class="page" id="page" style="display:none">
  <div id="cine-mount"></div>
  <div class="actions">
    <h3>Pass on the magic 🎁</h3>
    <p>Share this letter with someone who'd smile.</p>
    <div class="btns">
      <button class="b b-wa" onclick="shareImg()">📲 Share card</button>
      <a id="sh-wa" class="b b-copy" target="_blank" rel="noopener">🟢 WhatsApp link</a>
      <button class="b b-copy" onclick="copyLink()">🔗 Copy link</button>
    </div>
    <div><a class="b b-make" href="/">✨ Create your own letter</a></div>
  </div>
</div>

<button class="music" id="music" title="Play / pause music" aria-label="Play or pause music" style="display:none">🔔</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/cinematic.js"></script>
<script>
  var CARD_AUDIO = { halloween:'/bombinsound-halloween-suspense-horror-halloween-waltz-619348.mp3' };  // music for the shared card, per season
  var letterCardBlob = null;
  function lookFor(){ return { c1:theme&&theme.c1, c2:theme&&theme.c2, accent:theme&&theme.accent, primary:Cinematic.primaryFor(seasonKey), decor:Cinematic.decorFor(seasonKey) }; }
  function shareImg(){
    var text=((L&&L.emoji)||'🎁')+' A card for '+((L&&L.name)||'you')+'! Make yours free: '+location.host;
    if(letterCardBlob){ Cinematic.shareOrSave(letterCardBlob, text, 'card.jpg'); return; }
    Cinematic.cardImage(L, lookFor()).then(function(b){ letterCardBlob=b; Cinematic.shareOrSave(b, text, 'card.jpg'); }).catch(function(){});
  }

  function b64decode(str){
    str=String(str).replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='=';
    var bin=atob(str), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  var L=null, theme=null, cineTpl='globe', seasonKey='christmas';

  function setupLoaded(){
    document.title=(L.emoji||'🎁')+' A card for '+L.name;
    document.getElementById('ov-emoji').textContent=L.emoji||'🎁';
    document.getElementById('ov-title').textContent='A card for '+L.name;
    var url=location.href;
    var msg=(L.emoji||'🎁')+' A card for '+L.name+' — open it (with music 🎶): '+url;
    document.getElementById('sh-wa').href='https://wa.me/?text='+encodeURIComponent(msg);
    document.getElementById('ov-open').addEventListener('click', function(){
      document.getElementById('overlay').classList.add('hide');
      document.getElementById('page').style.display='block';
      Cinematic.render(document.getElementById('cine-mount'), L, cineTpl, { watermark:false, theme:theme });
      Cinematic.cardImage(L, lookFor()).then(function(b){ letterCardBlob=b; }).catch(function(){});
      document.getElementById('music').style.display='grid';
      Cinematic.music.setSeason(seasonKey);
      Cinematic.music.setAudio(CARD_AUDIO[seasonKey]||null);
      Cinematic.music.start();
    });
  }
  function showBroken(){
    document.getElementById('overlay').innerHTML =
      '<div class="gift" style="animation:none">🎄</div><h1>This card link looks broken</h1>'+
      '<p>The link may be incomplete. But you can make a brand new one!</p>'+
      '<a class="open-btn" href="/">Create a card 🎁</a>';
  }
  function initFromPayload(b64){
    try {
      var d=b64decode(b64);
      L={ name:d.n, paragraphs:d.P||[], date:d.dt||'', emoji:d.em, senderTitle:d.st, senderName:d.sn, dateline:d.dl, badge:d.bd };
      theme=Cinematic.themeForSeason(d.sk); cineTpl=d.ct||'globe'; seasonKey=d.sk||'christmas';
      setupLoaded();
    } catch(e){ showBroken(); }
  }
  (function(){
    var hash=location.hash.replace(/^#/,'');
    var m=location.pathname.match(/\/c\/([A-Za-z0-9_-]+)/);
    if(hash){ initFromPayload(hash); }
    else if(m){ fetch('/api/card/'+encodeURIComponent(m[1])).then(function(r){ return r.json(); }).then(function(j){ if(j && j.d) initFromPayload(j.d); else showBroken(); }).catch(showBroken); }
    else { showBroken(); }
  })();

  Cinematic.music.onChange(function(p){ var b=document.getElementById('music'); if(b) b.textContent=p?'🔔':'🔇'; });
  document.getElementById('music').addEventListener('click', function(){ Cinematic.music.toggle(); });

  function copyLink(){
    var url=location.href;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ flash('Copied! 🎁'); }, function(){ prompt('Copy this link:', url); }); }
    else { prompt('Copy this link:', url); }
  }
  function flash(t){ var b=document.querySelector('.b-copy'); if(!b) return; var o=b.innerHTML; b.innerHTML=t; setTimeout(function(){ b.innerHTML=o; },1600); }
</script>
</body>
</html>
